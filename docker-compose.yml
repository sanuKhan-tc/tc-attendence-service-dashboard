services:
  attendance-dashboard:
    build: .
    image: tc-attendance-dashboard:deploy
    env_file:
      - .env
    environment:
      PORT: 3001
      LOGIN_FILE: /app/shared/login.json
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_DRIVER: ${DOCKER_DB_DRIVER:-tedious}
      DB_SERVER: ${DOCKER_DB_SERVER:-host.docker.internal,1433}
      DB_DATABASE: ${DB_DATABASE:-COSEC}
      DB_USER: ${DOCKER_DB_USER:-}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-}
      DB_ENCRYPT: ${DOCKER_DB_ENCRYPT:-false}
      DB_CONNECTION_STRING: ${DOCKER_DB_CONNECTION_STRING:-}
    ports:
      - "127.0.0.1:9200:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
